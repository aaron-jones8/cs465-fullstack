<div class="container mt-4">
  <h2>Available Trips</h2>
  <div *ngIf="errorMessage()" class="alert alert-danger">
    {{ errorMessage() }}
  </div>
  <div class="row">
    <div class="col-md-4" *ngFor="let trip of trips()">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>
</div>
