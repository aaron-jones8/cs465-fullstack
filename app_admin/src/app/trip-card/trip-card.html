<div class="card mb-3">
  <img [src]="imageBaseUrl + trip.image" class="card-img-top" [alt]="trip.name">
  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>
    <p class="card-text"><strong>Resort:</strong> {{ trip.resort }}</p>
    <p class="card-text"><strong>Length:</strong> {{ trip.length }}</p>
    <p class="card-text"><strong>Price per person:</strong> ${{ trip.perPerson }}</p>
    <p class="card-text">{{ trip.description }}</p>
    <a [routerLink]="['/edit-trip', trip.code]" class="btn btn-secondary">Edit</a>
  </div>
</div>
